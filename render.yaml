# ════════════════════════════════════════════════════════════════
#  Render.com Blueprint — deploy ขึ้นคลาวด์แบบกดปุ่มเดียว
#
#  วิธีใช้:
#   1. push โค้ดขึ้น GitHub (ทำแล้ว)
#   2. เข้า https://dashboard.render.com/blueprints → New Blueprint Instance
#   3. เลือก repo wattanaa/TCOM แล้วกด Apply
#   4. Render จะสร้างฐานข้อมูล + backend + frontend ให้อัตโนมัติ
#      ค่า SESSION_SECRET สุ่มให้เอง เหลือแค่กรอก SEED_ADMIN_PASSWORD
#
#  หมายเหตุ: ไฟล์อัปโหลดบน backend แบบ free จะไม่ถาวร (ถูกล้างเมื่อ redeploy)
#            หากต้องการเก็บถาวรให้เพิ่ม Disk ให้ service backend
# ════════════════════════════════════════════════════════════════

databases:
  - name: tcom-db
    databaseName: tcom_db
    user: tcom
    plan: free
    region: singapore

services:
  # ── Backend API (Docker) ──
  - type: web
    name: tcom-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: tcom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true          # Render สุ่มค่าปลอดภัยให้อัตโนมัติ
      - key: SESSION_NAME
        value: tcom.sid
      - key: SEED_MODE
        value: demo                   # เปลี่ยนเป็น core เมื่อขึ้นใช้งานจริง
      - key: SEED_ADMIN_EMAIL
        value: admin@tcom.rtc.ac.th
      - key: SEED_ADMIN_PASSWORD
        sync: false                   # ต้องกรอกเองในหน้า dashboard (ไม่เก็บลง git)
      - key: SEED_ADMIN_NAME
        value: ผู้ดูแลระบบ
      # หลัง deploy ครั้งแรก ให้นำ URL ของ tcom-web มาวางที่นี่ เช่น https://tcom-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # ── Frontend (Static Site) ──
  - type: web
    name: tcom-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: ./frontend
    envVars:
      # หลัง deploy ครั้งแรก ให้นำ URL ของ tcom-api มาวาง แล้วต่อท้ายด้วย /api/v1
      # เช่น https://tcom-api.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
