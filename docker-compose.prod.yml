# ════════════════════════════════════════════════════════════════
#  TCOM — Production Stack (ทั้งระบบในคำสั่งเดียว)
#
#    cp .env.prod.example .env
#    # แก้ค่าใน .env (รหัสผ่าน DB, SESSION_SECRET, รหัสผู้ดูแล)
#    docker compose -f docker-compose.prod.yml up -d --build
#
#  จากนั้นเปิดเว็บที่  http://<ไอพีเครื่อง>/  (หรือ http://localhost/)
#  ระบบจะสร้างตาราง + ใส่ข้อมูลตั้งต้นให้อัตโนมัติตอน backend เริ่มทำงาน
# ════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนด POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: ${POSTGRES_DB:-tcom_db}
      TZ: Asia/Bangkok
    volumes:
      - tcom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcom} -d ${POSTGRES_DB:-tcom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ไม่ publish port ออกนอก — ให้เข้าถึงได้เฉพาะจากภายในเครือข่าย docker เท่านั้น (ปลอดภัยกว่า)

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tcom_db}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SESSION_SECRET: ${SESSION_SECRET:?ต้องกำหนด SESSION_SECRET ใน .env}
      SESSION_NAME: tcom.sid
      SESSION_MAX_AGE_HOURS: 8
      # SEED_MODE: core = เฉพาะข้อมูลแกนระบบ · demo = รวมข้อมูลตัวอย่าง · none = ไม่ seed
      SEED_MODE: ${SEED_MODE:-core}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@tcom.rtc.ac.th}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?ต้องกำหนด SEED_ADMIN_PASSWORD ใน .env}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-ผู้ดูแลระบบ}
      TZ: Asia/Bangkok
    volumes:
      - tcom_uploads:/app/uploads
      - tcom_backups:/app/backups

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      TZ: Asia/Bangkok

volumes:
  tcom_pgdata:
  tcom_uploads:
  tcom_backups:
