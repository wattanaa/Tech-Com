# nginx สำหรับเสิร์ฟ SPA + proxy ไป backend
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # จำกัดขนาดไฟล์อัปโหลดให้สอดคล้องกับฝั่ง backend (5MB + เผื่อ header)
  client_max_body_size 6m;

  # บีบอัดไฟล์ข้อความเพื่อให้โหลดเร็วขึ้น
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ── ส่งต่อ API ไปยัง backend ──
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # ── ส่งต่อไฟล์ที่อัปโหลด (รูปภาพ) ไปยัง backend ──
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
  }

  # ── cache ไฟล์ static ที่มี hash ในชื่อ ──
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ── SPA fallback: ทุกเส้นทางที่ไม่ใช่ไฟล์จริง ให้ส่ง index.html ──
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ไม่เปิดเผยเวอร์ชัน nginx
  server_tokens off;
}
